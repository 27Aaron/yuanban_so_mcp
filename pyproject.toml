[project]
name = "yuanban_so_mcp"
version = "0.1.0"
description = "腾讯元宝搜索（so.qq.com）MCP server：AI 问答与网页搜索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx[http2]>=0.27.0",
    "pycryptodome>=3.20.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
yuanban_so_mcp = "yuanban_so_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuanban_so_mcp"]
